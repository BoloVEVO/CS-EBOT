// Shows the which version of ebot is running on the server
ebot_version

// Specifies number of ebots playing on the server machine
//
// Default value: 10
ebot_quota "10"

// Specifies to always keep x amount of empty slot for humans
//
// Default value: 4
ebot_keep_slots "4"

// Specifies bot difficulty
// From 0 to 4, 4 > 0
// -1 = Random
//
// Default value: 4
ebot_difficulty "-1"

// Specifies ebot skill (only if ebot_difficulty is set to -1)
// 1 = Worst / 100 = Best
//
// Default value: 1 / 100
ebot_min_skill "1"
ebot_max_skill "100"

// Specifies the team, in which all creating bots will be forced to join
//
// Default value: any
ebot_force_team "any"

// If this value is "0" ebots will dont use any nametag
// If this value is "1" ebots will use [E-BOT] nametag
// If this value is "2" ebots will use [E-BOT] nametag + skill showed in name
//
// Default value: 2
ebot_name_tag "1"

// Specifies to give steam avatars to ebots
// Configuration at: avatars.cfg
//
// Default value: 0
ebot_display_avatar "0"

// Specifies to give fake pings to ebots
//
// Default value: 0
ebot_fake_ping "0"

// Specifies if all ebots on the server stopbots function, while this variable set to 1
//
// Default value: 0
ebot_stop_bots "0"

// Specifies if zombie ebots on the server stopbots function, while this variable set to 1
//
// Default value: 0
ebot_stop_zombie_bots "0"

// Specifies ebots can use flashlight
//
// Default value: 0
ebot_force_flashlight "0"

// Specifies human ebots can use flares in dark areas if they see anything
// they never use it if they never see any enemy, for dont want reveal themself positions
// after enemy gone they can use it if no enemy visible in near
//
// Default value: 1
ebot_use_flares "1"

// Specifies chance of use grenades
//
// Default value: 60
ebot_use_grenade_percent "60"

// Specifies human bots can use parachute when falling
// Enable only if your server has a parachute plugin (bots will use IN_USE input)
//
// Default value: 0
ebot_human_use_parachute "0"

// Prevents human bots from switching to a knife if they already have a better weapon equipped.
//
// Default value: 0
ebot_human_block_knife_switch 0

// Specifies to check enemy rendering, useful if enemy can be invisible etc.
//
// Default value: 0
ebot_check_enemy_rendering "1"

// Specifies to check enemy invincibility, if enemies can have godmode etc.
//
// Default value: 0
ebot_check_enemy_invincibility "1"

// Specifies to consider glass, if set to 1 ebots will count glass as wall
//
// Default value: 0
ebot_aim_trace_consider_glass "0"

// Specifies ebot zombies can use wallhack to find alive humans, useful in too large maps and zombie hell like mods
//
// Default value: 1
ebot_zombie_wall_hack "1"

// Specifies to consider glass, if set to 1 ebots will count glass as wall
//
// Default value: 0
ebot_aim_trace_consider_glass "0"

// Specifies human bots can aware of everything, this set to 1 automatically if "zp_lightning" is set to "a"
//
// Default value: 0
ebot_dark_mode "0"

// Specifies pasword key for setinfo information to acccess to the ebot menu and command
//
// Default value: ebot_pass
ebot_password_key "ebot_pass"

// Specifies password for accessing ebot menu and commands on the server running ebot
//
// Default value: ebot
ebot_password "ebot"

// Specifies to show waypoints without kicking ebots but editing is not allowed
//
// Default value: 0
ebot_show_waypoints "0"

// Specifies to let ebots count zombies as danger threats while pathfinding process to avoid them better
// Turning this off might be lower your cpu usage
//
// Default value: 1
ebot_zombie_count_as_path_cost "1"

// Specifies to ebots avoid their teammates, set to 1 if your server has semiclip
// It is set automatically when ebot_semiclip is enabled
//
// Default value: 0
ebot_has_semiclip "0"

// Enables built-in semiclip
// 0 = Disabled
// 1 = All players can semiclip with each other
// 2 = Only bots can semiclip with other bots
// 3 = Bots can semiclip with bots and real players, but real players cannot semiclip with other real players
//
// Default value: 0
ebot_semiclip "0"

// Specifies which teams use built-in semiclip
// 0 = All players can semiclip with each other
// 1 = Only Terrorists can semiclip with Terrorists
// 2 = Only Counter-Terrorists can semiclip with Counter-Terrorists
// 3 = Only players on the same team can semiclip
//
// Default value: 3
ebot_semiclip_team "3"

// Enables player render effects for built-in semiclip
// 0 = Do not change player rendering
// 1 = Fade semiclip players and highlight duck boost players
// Only players with semiclip active between them can see this effect. So, invisible zombies still stay invisible to humans.
//
// Default value: 1
ebot_semiclip_effects "1"

// Allows bots to try duck boosting on DJUMP waypoints.
// This setting is independent of ebot_semiclip: bots may still crouch for
// duck boost even when the built-in semiclip is disabled and an external
// semiclip plugin is used.
//
// Note: with built-in semiclip enabled, EBot also keeps players solid during
// the boost. With external semiclip, the external plugin must handle duck boost
// collision behavior correctly.
//
// Default value: 1
ebot_duck_boost "1"

// Specifies which team can be marked as ducking for duck boost
// 0 = All teams
// 1 = Terrorists only
// 2 = Counter-Terrorists only
//
// Default value: 0
ebot_duck_boost_team "0"

// Enables semiclip handling for non-player entities
// This is for entities added with Amxx_EBotRegisterEnemyEntity
// For example you can edit sandbags plugin for semiclip between humans
//
// Default value: 0
ebot_semiclip_entities "0"

// Specifies which breakables can be breaked
// If breakable health is higher than that value ebots will ignore it
//
// Default value: 3000.0
ebot_breakable_health_limit "3000.0"

// Allows bots to attack custom breakable entities without checking their classname.
// Entities still must be under ebot_breakable_health_limit.
// Enable this for breakable mines or sandbags
//
// Default value: 0
ebot_custom_breakables "0"

// Enables cooperative breakable destruction for human bots.
// When set to 1 (default), a nearby human bot (within 150 units) can join a teammate’s active Process::DestroyBreakable 
// on the same breakable entity if it has direct trace visibility to it.
//
// Default value: 1
ebot_human_help_breakables "1"

// Enables cooperative breakable destruction for zombie bots (active only with ebot_has_semiclip 1).
// When set to 1 (default), a nearby zombie bot (within 24 units) can join a teammate’s active Process::DestroyBreakable 
// on the same breakable entity if it has direct trace visibility to it.
//
// Default value: 1
ebot_zombie_help_breakables "1"

// Enables extra damage scaling for native breakable entities such as func_breakable, breakable func_pushable, and func_wall.
// Set to 1 to allow breakable damage to be multiplied by ebot_breakables_dmg_multiplier.
// Set to 0 to keep default game damage behavior.
//
// Default value: 0
ebot_enable_breakables_dmg_multiplier "0"
ebot_breakables_dmg_multiplier 2.0

// Instantly destroys a breakable if it blocks the bot’s path. 
//
// Default value: 0
ebot_kill_breakables 0

// Delay in seconds before applying the zombie health multiplier to bots.
// Because the HP from the zombie plugin is applied first.
// Used when a bot spawns as a zombie or becomes a zombie.
//
// Default: 1.0
ebot_hp_multiplier_delay "1.0"

// Multiplies bot health after the bot becomes a zombie.
// Example: 2.0 = double zombie bot HP, 0.5 = half HP, 1.0 = default HP.
// Values below 0 are treated as 0.
//
// Default: 1.0
ebot_zombie_hp_multiplier "1.0"

// Enables bots to react to some radio messages..
// Default: 1
ebot_radio 1

// Maximum number of bots that can follow one player after a radio follow command
//
// Default value: 3
ebot_radio_follow_max_bots "3"

// Maximum distance for bots to react to a radio follow command
//
// Default value: 700.0
ebot_radio_follow_distance "700.0"

// Specifies ebots to use faster A* algorithm, reduces AI performance
// Forced to 1 if waypoint number is higher than 2048
//
// Default value: 0
ebot_force_shortest_path "0"

// Specifies to ebots randomize cost of pathfinding
//
// Default value: 0.9
ebot_pathfinder_seed_min "0.9"

// Specifies to ebots randomize cost of pathfinding
//
// Default value: 1.1
ebot_pathfinder_seed_max "1.1"

// Specifies with of helicopter, put helicopter waypoint to where helicopter lands
// when it arrives bots should able to track helicopter
// ebot_debug 1 helps to figure out the best value for maps
//
// Default value: 54.0
ebot_helicopter_width "54.0"

// Specifies to use pathfinding to perform avoiding a zombie
// Makes human bots smarter but costs as more cpu usage
//
// Default value: 1
ebot_use_pathfinding_for_avoid "1"

// Distance around a human bot path used to check zombie danger while pathfinding
//
// Default value: 500.0
ebot_human_path_zombie_check_distance "500.0"

// Specifies ebots should attack enemies or not
//
// Default value: 0
ebot_ignore_enemies "0"

// Sets the maximum distance at which human bots will shoot at zombie bots. 
// -1 -> disabled, 500 -> useful for dark maps, 0.0 -> basically they will never shoot
//
// Default value: -1
ebot_human_target_max_distance -1

// Chance (%) that a zombie bot with no current target will pick a completely random human target, regardless of distance.
// Suitable for the classic zombie mode, where the player in the farthest position has to wait until all others are infected before any zombie goes after them.
//
// Default value: 15
ebot_zombie_random_target_percent 15

// Percentage of human bots with personality Rusher that will not look for a camping spot.
// At the start of the round, it randomly selects bots that will not intentionally search for camps. 
// These bots will move randomly around the map.
//
// Default value: 0
ebot_rusher_no_camp_percent "0"

// Similar to new round ebot no attack plugin, but better
// If ebots attack each other on any zombie mode set this value to infection start time
//
// Default value: 0.0
ebot_zp_delay_custom "0.0"

// Kills all bots if no real human player is alive in the human team for the specified time.
// 0 = disabled, otherwise the value specifies the number of seconds with no real human alive
//
// Default value: 0
ebot_kill_bots_when_all_humans_dead 0

// Can humans use double jump ?
// Enable only if you have a double jump plugin
//
// Default value: 0
ebot_human_double_jump "0"

// Can zombies use double jump ?
// Enable only if you have a double jump plugin
//
// Default value: 0
ebot_zombie_double_jump "0"

// Specifies ebot to download waypoint if no waypoint found for the map
//
// Default value: 0
ebot_download_waypoints "0"

// Specifies where to search waypoints for download
//
// Default value: 
ebot_download_waypoints_from ""

// Specifies where to search waypoint format for download
//
// Default value: ewp
ebot_download_waypoints_format "ewp"

// Specifies add human camp waypoints if there's no
// (Mostly on auto generated waypoints)
//
// Default value: 1
ebot_auto_human_camp_points "1"

// Specifies waypoint size
//
// Default value: 7
ebot_waypoint_size "7"

// Specifies default waypoint r
//
// Default value: 0
ebot_waypoint_r "0"

// Specifies default waypoint g
//
// Default value: 255
ebot_waypoint_g "255"

// Specifies default waypoint b
//
// Default value: 0
ebot_waypoint_b "0"

// Specifies disable path matrix, reduces memory usage but costs more cpu usage
// (Also reduces AI's performance)
//
// Default value: 0
ebot_disable_path_matrix "0"

// If you're having problems on xash engine set this to 1
//
// Default value: 0
ebot_running_on_xash "0"

// Specifies to start analyzer if map doesnt have a waypoints
// Like how CZ Bots do
//
// Default value: 1
ebot_analyze_auto_start "1"

// Specifies to let analyzer choose start position/waypoint for analyzing
// If disabled, you must add one waypoint for start analyzing process
//
// Default value: 1
ebot_analyze_starter_waypoints "1"

// Specifies to how much analyzer can expand around
// Higher is not good if you dont want edit the waypoints
//
// Default value: 40
ebot_analyze_grid_distance "40"

// Specifies how many existing waypoints analyzer expands per server frame
// Lower values reduce CPU spikes but make waypoint generation take longer
//
// Default value: 8
ebot_analyze_waypoints_per_frame "8"

// Specifies how many optimizer passes analyzer runs per server frame
// Lower values reduce CPU spikes but make waypoint optimization take longer
//
// Default value: 1
ebot_analyze_optimize_passes_per_frame "1"

//Defines the base spatial tolerance for waypoint optimization during map analysis post-processing.
//Higher values make optimization more aggressive (more waypoint merging/removal), while lower values keep more detail (more conservative cleanup).
//
// Default value: 99
ebot_analyze_optimize_distance 99

// Specifies to analyzer maximum ebot jump height (only for waypoint generator)
// More than 62 is not recommended, 65 is max jump height with default gravity
//
// Default value: 62
ebot_analyze_max_jump_height "62"

// Used to perform better auto generated waypoints to edit
// 1 = Little
// 2 = More
// Best with "ebot_analyze_grid_distance" set to "128"
//
// Default value: 0
ebot_analyze_post_processing "2"


